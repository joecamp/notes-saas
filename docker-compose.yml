services:

  # --- PostgreSQL database ---
  # Uses the official postgres:15 image. Data is persisted in a named volume
  # so it survives container restarts. The healthcheck lets dependent services
  # wait until postgres is actually ready to accept connections before starting.
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"       # Expose to host so you can still connect with psql/pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- ASP.NET Core 9 API ---
  # Built from the Dockerfile in backend/NotesApi. ASP.NET Core containers
  # default to port 8080, which we map to the host's 5073 — the port the
  # frontend already expects. The connection string overrides the one in
  # appsettings.json so the backend reaches "db" (the service name above)
  # instead of localhost. ASPNETCORE_ENVIRONMENT=Development keeps Swagger on.
  # depends_on with service_healthy ensures the DB is ready before the app starts.
  backend:
    build:
      context: ./backend/NotesApi
    ports:
      - "5073:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=notesdb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET}
      Kestrel__Endpoints__Http__Url: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy

  # --- React (nginx, production build) ---
  # Built from the Dockerfile in frontend. Stage 1 compiles the Vite app into
  # static files, stage 2 serves them with nginx on port 80, mapped to 5173
  # on the host so the dev URL stays the same. VITE_API_URL is baked into the
  # bundle at build time via a Docker build arg.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5073/api
    depends_on:
      - backend

volumes:
  postgres_data:
